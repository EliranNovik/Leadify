<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="RMQ 2.0 - CRM System" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RMQ 2.0" />
    <title>RMQ 2.0</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/RMQ_LOGO.png" />
    <link rel="icon" type="image/png" href="/RMQ_LOGO.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/RMQ_LOGO.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/RMQ_LOGO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script>
      // Prevent browser from interfering with React Router scroll restoration
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      // Pick the PWA manifest before React boots, so the browser reads the right display mode when
      // the user installs (and when an installed app re-checks the manifest on launch):
      //   /entry-kiosk      -> fullscreen, hides the tablet's bottom browser chrome
      //   phones + tablets  -> standalone (default manifest), no browser chrome
      //   desktop           -> minimal-ui, window keeps its navigation bar
      (function () {
        /**
         * True only for desktop operating systems. Android tablets report `userAgentData.mobile`
         * as false, so platform is the signal to trust, not the mobile flag or pointer type —
         * a Windows touchscreen laptop is still a desktop.
         */
        function isDesktopPlatform() {
          var uaData = navigator.userAgentData;
          if (uaData && uaData.platform) {
            return uaData.platform === 'Windows' || uaData.platform === 'macOS'
              || uaData.platform === 'Linux' || uaData.platform === 'Chrome OS';
          }
          // Safari and Firefox have no userAgentData; fall back to the UA string.
          var ua = navigator.userAgent || '';
          if (/Android|iPhone|iPod|iPad|Mobile|Tablet|Silk|Kindle|BlackBerry|Opera Mini|IEMobile|webOS/i.test(ua)) {
            return false;
          }
          // iPadOS Safari claims to be Macintosh; multi-touch gives it away.
          if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return false;
          return /Windows|Macintosh|X11|Linux/i.test(ua);
        }

        try {
          var manifest = document.querySelector('link[rel="manifest"]');
          if (!manifest) return;
          if (location.pathname.indexOf('/entry-kiosk') === 0) {
            manifest.setAttribute('href', '/manifest-entry-kiosk.json');
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute('content', '#0a1628');
            document.documentElement.style.backgroundColor = '#0a1628';
            document.documentElement.style.colorScheme = 'dark';
            return;
          }
          if (isDesktopPlatform()) manifest.setAttribute('href', '/manifest-desktop.json');
        } catch (e) { /* ignore */ }
      })();
      // Business card: tint browser chrome dark green before React boots (no white flash).
      (function () {
        try {
          if (location.pathname.indexOf('/business-card/') !== 0) return;
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', '#0F241F');
          document.documentElement.style.backgroundColor = '#0F241F';
          document.documentElement.style.colorScheme = 'dark';
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const applyThemeClasses = (theme) => {
          const rootEl = document.getElementById('root');
          const isDark = theme === 'dark' || theme === 'dark2';
          const isAlt = theme === 'alternative';

          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', isDark);
          document.body.classList.toggle('dark', isDark);
          rootEl?.classList.toggle('dark', isDark);

          document.documentElement.classList.toggle('theme-alt', isAlt);
          document.body.classList.toggle('theme-alt', isAlt);
          rootEl?.classList.toggle('theme-alt', isAlt);

          document.documentElement.classList.toggle('theme-dark2', theme === 'dark2');
          document.body.classList.toggle('theme-dark2', theme === 'dark2');
          rootEl?.classList.toggle('theme-dark2', theme === 'dark2');
        };

        try {
          const storedTheme = localStorage.getItem('theme');
          const savedTheme =
            storedTheme === 'dark' || storedTheme === 'dark2' || storedTheme === 'alternative'
              ? storedTheme
              : 'light';
          applyThemeClasses(savedTheme);
        } catch (err) {
          applyThemeClasses('light');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
